app = "homeops-gateway"
primary_region = "iad"  # us-east (IAD = Ashburn, VA)
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  # Bun dockerfile auto-detected — Fly builds from Dockerfile
  # See services/gateway/Dockerfile

[env]
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
